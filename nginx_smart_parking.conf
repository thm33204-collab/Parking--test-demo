# Cấu hình Nginx Reverse Proxy cho Smart Parking
# Đặt file này vào /etc/nginx/sites-available/smart_parking
# Sau đó kích hoạt: sudo ln -s /etc/nginx/sites-available/smart_parking /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Hoặc điền Domain / Public DNS của EC2 nếu có

    # Giới hạn kích thước upload ảnh lên đến 25MB
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Thiết lập timeout xử lý cho nhận diện OCR
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
