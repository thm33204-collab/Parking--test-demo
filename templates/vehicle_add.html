{% extends "base.html" %}

{% block title %}Đăng ký phương tiện mới - Smart Parking{% endblock %}

{% block extra_css %}
.form-container {
    max-width: 500px;
    margin: 0 auto;
}
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <div class="card-header">
            <h1 class="card-title"><i class="fa-solid fa-plus-circle" style="margin-right: 8px; color: var(--primary-color);"></i> Đăng ký phương tiện mới</h1>
        </div>
        
        <form method="POST" action="{{ url_for('vehicle_add') }}">
            <div class="form-group">
                <label for="plate_number" class="form-label">Biển số xe</label>
                <input type="text" id="plate_number" name="plate_number" class="form-control" placeholder="Ví dụ: 30A-123.45" required>
            </div>
            
            <div class="form-group">
                <label for="vehicle_type" class="form-label">Loại xe</label>
                <select id="vehicle_type" name="vehicle_type" class="form-control" required>
                    <option value="car">Ô tô (Car)</option>
                    <option value="bike">Xe máy / Xe khác (Bike)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="owner_name" class="form-label">Tên chủ xe</label>
                <input type="text" id="owner_name" name="owner_name" class="form-control" placeholder="Nhập tên chủ xe">
            </div>
            
            <div class="form-group">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Nhập số điện thoại liên lạc">
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end;">
                <a href="{{ url_for('vehicles') }}" class="btn btn-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu phương tiện
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
